<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm">
    <h1>Admin</h1>
    <input type="password" id="pw" placeholder="Password" autofocus required>
    <button class="btn" type="submit">Log in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" hidden>
  <aside>
    <div class="brand">Admin panel</div>
    <button data-tab="stories" class="on">Stories</button>
    <button data-tab="settings">Site settings</button>
    <button data-tab="enquiries">Enquiries <span id="enqCount" class="pill" hidden></span></button>
    <a href="/" target="_blank">View site &nearr;</a>
    <button id="logout" class="out">Log out</button>
  </aside>
  <main id="view"></main>
</div>
<div id="toast" class="toast"></div>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
